# Remnawave Node + ACME (nginx :80 + certbot).
# Документация: https://docs.rw/docs/install/remnawave-node
#
# 443 — Xray внутри remnanode (host network): REALITY / WS+TLS по конфигу панели.
# 8080 — NODE_PORT, API ноды для панели (в файрволе только IP панели).
# 80 — профиль acme, HTTP-01 для certbot.
#
# Пути к сертификатам в Xray: https://docs.rw/docs/install/remnawave-node#xray-ssl-cert-for-node

name: ssl-remnanode

x-ulimits: &ulimits
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: 3

services:
  remnanode:
    image: remnawave/node:latest
    container_name: remnanode
    hostname: remnanode
    restart: always
    network_mode: host
    <<: [*ulimits, *logging]
    cap_add:
      - NET_ADMIN
    environment:
      - NODE_PORT=${NODE_PORT:-8080}
      # Вытаскиваем SECRET_KEY из .env, который заполняет скрипт.
      - "SECRET_KEY=${SECRET_KEY}"
    volumes:
      - ./letsencrypt/live/${DOMAIN}:/var/lib/remnawave/configs/xray/ssl:ro
      # certbot кладёт в live/ относительные симлинки на ../../archive/<домен>/;
      # без этого mount'а они внутри контейнера битые и Xray не видит сертификат.
      - ./letsencrypt/archive/${DOMAIN}:/var/lib/remnawave/configs/archive/${DOMAIN}:ro

  nginx-acme:
    image: nginx:1.28-alpine
    container_name: ssl-remnanode-nginx-acme
    restart: unless-stopped
    <<: [*logging]
    profiles:
      - acme
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    container_name: ssl-remnanode-certbot
    <<: [*logging]
    profiles:
      - cert
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
